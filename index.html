<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoe goed ken jij mij?</title><style>body{margin:0;background:#fff3f6;font:16px system-ui;color:#33212a}main{max-width:540px;margin:auto;padding:18px}header{background:linear-gradient(125deg,#bd235f,#f47378);color:white;text-align:center;padding:24px;border-radius:20px}h1{margin:0;font-size:26px}.card{background:white;border:1px solid #f1d7e0;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #7e26440c}label{display:block;margin:12px 0 5px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #dbb7c4;border-radius:10px}button{font:inherit;border:0;border-radius:10px;padding:13px;cursor:pointer}button.primary{background:#cf3068;color:white;width:100%;font-weight:700;margin-top:10px}button.secondary{background:#fce5ed;color:#862849;margin:4px}button.option{width:100%;text-align:left;background:#fff8fa;border:1px solid #eed4dd;margin:5px 0}button.selected{background:#f9cadb;border:2px solid #ca2d68}.muted{color:#795d6b;font-size:14px}.scores{display:flex;justify-content:space-around;text-align:center}.scores strong{display:block;font-size:26px;color:#ca2d68}.pill{display:inline-block;border-radius:30px;background:#fce5ed;padding:6px 12px;font-size:13px}details{margin:10px 0;border-top:1px solid #eee;padding-top:10px}small{color:#795d6b}#app{min-height:250px} .actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{flex:1}</style><main><header><div style="font-size:32px">💕</div><h1>Hoe goed ken jij mij?</h1><div>Het relatievragenspel voor twee</div></header><div id="app"></div></main><script>
const topics=[
['Romantiek',['Wat maakt een avond samen voor mij extra bijzonder?','Welk klein gebaar geeft mij het meest een geliefd gevoel?','Wat zou ik het liefst doen op een onverwachte date?','Hoe laat ik het duidelijkst merken dat ik van iemand houd?','Wat zou ik kiezen voor een romantisch weekend?','Welke verrassing zou mij het meest raken?','Waar geniet ik het meest van als we samen zijn?','Wat zou ik graag vaker samen beleven?'],['Samen koken','Een spontaan uitje','Knuffelen en praten','Een persoonlijke verrassing']],
['Humor',['Wat zou mij het snelst aan het lachen maken?','Wat doe ik als een plan volledig mislukt?','Welke gekke uitdaging zou ik het eerst aangaan?','Wat vind ik stiekem grappiger dan ik toegeef?','Wat zou ik doen als ik een dag beroemd was?','Welke rol neem ik in een grappige groepssituatie?','Hoe reageer ik op een slechte grap?','Waar zou ik het meest om kunnen lachen tijdens vakantie?'],['Zelf grappen maken','Droog commentaar geven','Onbedaarlijk lachen','Eerst serieus blijven']],
['Dagelijks leven',['Wat doe ik het liefst op een vrije ochtend?','Wat helpt mij het best na een drukke dag?','Waar besteed ik spontaan een extra vrij uur aan?','Hoe begin ik het liefst mijn weekend?','Wat kies ik als ik nergens rekening mee hoef te houden?','Wat is mijn favoriete manier om thuis te ontspannen?','Wat doe ik als onverwacht een afspraak uitvalt?','Wat maakt een gewone dag voor mij geslaagd?'],['Rustig thuis zijn','Iets actiefs ondernemen','Samen iets gezelligs doen','Een nieuwe plek ontdekken']],
['Toekomst',['Wat zou ik het liefst volgend jaar samen proberen?','Welke gezamenlijke droom spreekt mij het meest aan?','Wat zou ik doen als we plots een maand vrij hadden?','Welke verandering in ons dagelijks leven zou ik waarderen?','Waar zou ik het liefst samen herinneringen maken?','Wat zou ik kiezen als geld even geen rol speelde?','Welk avontuur past het best bij mij?','Wat zou ik graag samen leren?'],['Een verre reis','Een nieuw gezamenlijk hobbyproject','Meer kleine uitstapjes','Een grote gezamenlijke uitdaging']],
['Karakter',['Hoe reageer ik als iets onverwacht anders loopt?','Wat vind ik belangrijk bij een lastige beslissing?','Hoe ga ik meestal om met een meningsverschil?','Wat heb ik het meest nodig als ik me onzeker voel?','Welke eigenschap waardeer ik bij anderen?','Hoe zou ik een grote verrassing ontvangen?','Wat doe ik wanneer ik iets spannend vind?','Waar ben ik volgens mezelf het meest trots op?'],['Rust en zekerheid','Humor en luchtigheid','Eerlijkheid en duidelijkheid','Vrijheid en avontuur']],
['Samen',['Wat zou ik kiezen voor een dag zonder verplichtingen?','Welke gezamenlijke gewoonte zou ik willen beginnen?','Wat vind ik het fijnst aan onze tijd samen?','Hoe vieren we volgens mij het best iets bijzonders?','Wat zou ik het liefst samen ontdekken?','Wat zou ik doen als we een weekend zonder telefoon hadden?','Welk soort herinnering wil ik graag maken?','Wat is voor mij de leukste spontane activiteit?'],['Een dagje weg','Thuis ontspannen','Samen iets nieuws proberen','Lekker uit eten']],
['Herinneringen',['Welke herinnering zou ik graag opnieuw beleven?','Wat blijft mij het sterkst bij van een mooie dag?','Welke foto zou ik het liefst opnieuw maken?','Wat zou ik het liefst bewaren in een herinneringsdoos?','Welk moment zou ik graag met jou herbeleven?','Waar praat ik jaren later nog over?','Welke verrassing vergeet ik nooit?','Wat maakt een herinnering voor mij bijzonder?'],['Een bijzondere reis','Een klein intiem moment','Een grappige gebeurtenis','Een mijlpaal of feest']],
['Voorkeuren',['Welke vakantie past het best bij mij?','Welk soort cadeau zou ik kiezen?','Welke zaterdagavond heeft mijn voorkeur?','Welke activiteit zou ik spontaan boeken?','Wat kies ik als ik mezelf mag verwennen?','Welke omgeving geeft mij het meeste energie?','Wat zou ik op een onverwachte vrije dag doen?','Welke sfeer vind ik het fijnst?'],['Gezellig en rustig','Actief en sportief','Luxe en comfortabel','Avontuurlijk en spontaan']]
,['Sensuele verlangens (18+)',['Welk soort aanraking vind ik het meest romantisch?','Wanneer voel ik mij het meest aantrekkelijk?','Welke sfeer helpt mij het best om intiem te zijn?','Hoe laat ik het liefst merken dat ik zin heb in intimiteit?','Wat zou ik graag vaker met jou bespreken over onze verlangens?','Welke vorm van voorspelbare of spontane romantiek spreekt mij aan?','Wat is voor mij het belangrijkst om me veilig en ontspannen te voelen in bed?','Hoe ontdek ik het liefst samen een nieuwe wens?','Welke setting zou ik kiezen voor een sensuele avond?','Hoe zou ik aangeven dat ik iets liever niet wil?','Wat vind ik aantrekkelijk aan jouw initiatief?','Welke vorm van nabijheid mis ik soms?'],['Rustig en teder','Speels en spontaan','Passioneel en intens','Eerst praten en afstemmen']]
];
const bank=topics.flatMap((t,i)=>t[1].map((q,j)=>({id:'v1-'+i+'-'+j,category:t[0],q,options:t[2]})));
const KEY='relatiespel_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{games:[],seen:{}}}catch{db={games:[],seen:{}}}db.games??=[];db.seen??={};let game=null,stage='setup',answer=null,guess=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Opslaan is mislukt. Maak een back-up.')}};const pair=names=>names.map(n=>n.trim().toLocaleLowerCase('nl').replace(/\s+/g,' ')).sort().join('||');const stamp=()=>new Date().toLocaleString('nl-NL');const fmt=d=>new Date(d).toLocaleString('nl-NL');function selectAll(e){e.target.select()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){const a=$('#app');if(stage==='setup'){a.innerHTML=`<section class="card"><h2>Nieuw spel</h2><label>Speler 1</label><input id="n1" value="Speler 1"><label>Speler 2</label><input id="n2" value="Speler 2"><label>Aantal vragen</label><input id="count" type="number" min="1" max="${bank.length}" value="15"><label style="font-weight:500"><input id="adult" type="checkbox" style="width:auto;margin-right:8px" checked> Sensuele verlangens (18+) meenemen</label><p class="muted">${bank.length} originele vragen beschikbaar. Bij dezelfde twee namen komen eerder gespeelde vragen pas terug als de vragenbank op is.</p><button class="primary" id="start">♥ Start spel</button></section><section class="card"><h3>Opgeslagen partijen (${db.games.length})</h3><button class="secondary" id="history">Bekijk historie</button><button class="secondary" id="export">Back-up downloaden</button><label class="muted">Back-up terugzetten (JSON)</label><input type="file" id="import" accept="application/json,.json"></section>`;['n1','n2'].forEach(id=>$('#'+id).addEventListener('focus',selectAll));$('#start').onclick=start;$('#history').onclick=()=>{stage='history';render()};$('#export').onclick=backup;$('#import').onchange=restore;return}
if(stage==='history'){a.innerHTML=`<section class="card"><h2>Partijhistorie</h2><button class="secondary" id="back">← Terug</button>${db.games.length?db.games.slice().reverse().map(g=>`<details><summary><b>${esc(g.names.join(' & '))}</b> — ${fmt(g.started)}<br><small>${g.scores.join(' – ')} hartjes · ${g.records.length} vragen${g.finished?' · afgerond':' · onderbroken'}</small></summary><button class="secondary" data-pdf="${db.games.indexOf(g)}">📄 Bewaar als PDF</button>${g.records.map((r,i)=>`<div style="border-top:1px solid #eee;padding:10px 0"><b>${i+1}. ${esc(r.q)}</b><br><small>${esc(r.category)} · ${esc(r.answerer)} antwoordde: ${esc(r.answer)}<br>${esc(r.guesser)} voorspelde: ${esc(r.guess)} · ${r.correct?'♥ goed':'niet goed'}</small></div>`).join('')}</details>`).join(''):'<p>Nog geen partijen opgeslagen.</p>'}</section>`;$('#back').onclick=()=>{stage='setup';render()};a.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>printGame(db.games[Number(b.dataset.pdf)]));return}
let i=game.records.length;
let p=i%2;
let other=1-p;

if(stage==='end'){a.innerHTML=`<section class="card" style="text-align:center"><h2>🏆 Partij afgelopen!</h2><p>${game.scores[0]===game.scores[1]?'Gelijkspel!':'Winnaar: '+esc(game.names[game.scores[0]>game.scores[1]?0:1])}</p><div class="scores">${game.names.map((n,j)=>`<div>${esc(n)}<strong>♥ ${game.scores[j]}</strong></div>`).join('')}</div><button class="primary" id="home">Naar start</button><button class="secondary" id="review">Bekijk deze partij</button></section>`;$('#home').onclick=()=>{stage='setup';render()};$('#review').onclick=()=>{stage='history';render()};return}
let q=bank.find(x=>x.id===game.ids[i]);
let header=`<section class="card"><div class="scores">${game.names.map((n,j)=>`<div>${esc(n)}<strong>♥ ${game.scores[j]}</strong></div>`).join('')}</div><p class="muted" style="text-align:center">Vraag ${i+1} van ${game.ids.length} · ${esc(q.category)}</p></section>`;
if(stage==='handoff'){a.innerHTML=header+`<section class="card" style="text-align:center"><h2>🔒 Geef de telefoon door</h2><p>Antwoord van <b>${esc(game.names[p])}</b> is geheim opgeslagen.</p><p>${esc(game.names[other])} mag nu raden.</p><button class="primary" id="go">Verder</button></section>`;$('#go').onclick=()=>{stage='guess';render()};return}
if(stage==='result'){let correct=answer===guess;a.innerHTML=header+`<section class="card" style="text-align:center"><h2>${correct?'💖 Goed geraden!':'💌 Niet geraden'}</h2><b>${esc(q.q)}</b><p>${esc(game.names[p])}: <b>${esc(q.options[answer])}</b></p><p>${esc(game.names[other])} voorspelde: <b>${esc(q.options[guess])}</b></p><p>${correct?'+1 hartje voor '+esc(game.names[other]):'Deze ronde geen hartje'}</p><button class="primary" id="next">${game.records.length===game.ids.length?'Bekijk eindstand':'Volgende vraag'}</button></section>`;$('#next').onclick=()=>{answer=null;guess=null;if(game.records.length===game.ids.length){game.finished=true;save();stage='end'}else stage='answer';render()};return}
let isAnswer=stage==='answer';a.innerHTML=header+`<section class="card"><div class="pill">${isAnswer?esc(game.names[p])+' antwoordt in het geheim':esc(game.names[other])+' voorspelt'}</div><h2>${esc(q.q)}</h2>${q.options.map((o,j)=>`<button class="option ${(isAnswer?answer:guess)===j?'selected':''}" data-index="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<button class="primary" id="submit" ${(isAnswer?answer:guess)===null?'disabled style="opacity:.45"':''}>${isAnswer?'Bewaar geheim antwoord':'Onthul antwoorden'}</button></section>`;a.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{if(isAnswer)answer=+b.dataset.index;else guess=+b.dataset.index;render()});$('#submit').onclick=()=>{if(isAnswer){stage='handoff'}else{let correct=answer===guess;if(correct)game.scores[other]++;game.records.push({id:q.id,q:q.q,category:q.category,answerer:game.names[p],guesser:game.names[other],answer:q.options[answer],guess:q.options[guess],correct});(db.seen[game.key]??=[]).push(q.id);save();stage='result'}render()};}
function start(){let names=[$('#n1').value.trim()||'Speler 1',$('#n2').value.trim()||'Speler 2'];if(names[0].toLowerCase()===names[1].toLowerCase()){alert('Vul twee verschillende namen in.');return}let count=Number($('#count').value);if(!Number.isInteger(count)||count<1||count>bank.length){alert('Kies 1 t/m '+bank.length+' vragen.');return}let key=pair(names),seen=new Set(db.seen[key]||[]),eligible=bank.filter(q=>$('#adult').checked||q.category!=='Sensuele verlangens (18+)'),fresh=shuffle(eligible.filter(q=>!seen.has(q.id)).map(q=>q.id)),old=shuffle(eligible.filter(q=>seen.has(q.id)).map(q=>q.id));if(fresh.length+old.length<count){alert('Voor deze categorie-instelling zijn maximaal '+eligible.length+' vragen beschikbaar.');return}if(fresh.length<count){if(!confirm('Er zijn nog '+fresh.length+' nieuwe vragen voor jullie. Wil je ook eerdere vragen opnieuw gebruiken?'))return}game={names,key,ids:[...fresh,...old].slice(0,count),scores:[0,0],records:[],started:new Date().toISOString(),finished:false};db.games.push(game);save();answer=null;guess=null;stage='answer';render()}
function printGame(g){const w=window.open('','_blank');if(!w){alert('Sta pop-ups toe om de PDF te maken.');return}const rows=g.records.map((r,i)=>`<section><h3>${i+1}. ${esc(r.q)}</h3><p><b>Categorie:</b> ${esc(r.category)}<br><b>${esc(r.answerer)}:</b> ${esc(r.answer)}<br><b>Voorspelling ${esc(r.guesser)}:</b> ${esc(r.guess)}<br><b>Resultaat:</b> ${r.correct?'Goed geraden, 1 hartje':'Niet goed geraden'}</p></section>`).join('');w.document.write(`<!doctype html><html lang="nl"><meta charset="utf-8"><title>Relatiespel ${esc(g.names.join(' en '))}</title><style>body{font:14px Arial,sans-serif;color:#222;max-width:760px;margin:30px auto;line-height:1.5}h1{color:#bd235f}section{border-bottom:1px solid #ddd;break-inside:avoid;padding:9px 0}h3{margin:0}p{margin:5px 0}@media print{body{margin:12mm}}</style><h1>💕 Hoe goed ken jij mij?</h1><p><b>Spelers:</b> ${esc(g.names.join(' & '))}<br><b>Datum:</b> ${fmt(g.started)}<br><b>Hartjes:</b> ${esc(g.names[0])}: ${g.scores[0]} — ${esc(g.names[1])}: ${g.scores[1]}<br><b>Status:</b> ${g.finished?'Afgerond':'Onderbroken'}</p><h2>Vragen en antwoorden</h2>${rows}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></html>`);w.document.close()}
function backup(){let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relatiespel-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result),d=x.data;if(!Array.isArray(d.games)||typeof d.seen!=='object'||!d.seen)throw Error();if(confirm('Bestaande gegevens vervangen door deze back-up?')){db=d;save();render()}}catch{alert('Geen geldige back-up.')}};reader.readAsText(f)}render();
</script></html>
